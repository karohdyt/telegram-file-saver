# Local Telegram Bot API server - this is what lifts Telegram's file limits
# (up to 2 GB per file instead of 20 MB). The Python bot itself runs OUTSIDE
# Docker, directly on the server (see README.md).
#
# Usage:  cp .env.example .env  &&  nano .env  &&  docker compose up -d

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      # Downloaded files land here. On the host this folder is
      # /var/lib/docker/volumes/telegram-bot-api-data/_data
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      # Prefer another disk? Replace the line above with a folder of your own
      # and set API_HOST_DIR to the same folder in .env, e.g.
      #   - /mnt/storage/telegram-bot-api:/var/lib/telegram-bot-api
    ports:
      # reachable from this server only - never expose it to the internet
      - "127.0.0.1:8081:8081"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  telegram-bot-api-data:
    # fixed name -> exactly "telegram-bot-api-data" in `docker volume ls`
    name: telegram-bot-api-data
